spring.application.name=securenotes

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/securenotes}
spring.datasource.username=${DB_USERNAME:securenotes_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-minimum-32-characters}
app.jwt.expiration-ms=86400000